
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WEBENS DIAMONDS</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #07101f;
  color: white;
  text-align: center;
}
header {
  padding: 25px 10px;
  background: #111a35;
  border-bottom: 2px solid #24c8ff;
}
h1, h2 { color: #36c5ff; }
h1 { font-size: 28px; }
.intro { padding: 15px; }
.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  padding: 12px;
}
.pack {
  background: #182f4b;
  border: 1px solid #36c5ff;
  border-radius: 15px;
  padding: 15px 8px;
}
.diamond { font-size: 30px; }
.price {
  color: #36c5ff;
  font-size: 19px;
  font-weight: bold;
}
button {
  width: 100%;
  padding: 13px 6px;
  background: #08a9e8;
  color: #061326;
  border: 0;
  border-radius: 9px;
  font-weight: bold;
  font-size: 15px;
}
form {
  margin: 15px;
  padding: 20px;
  background: #182f4b;
  border: 1px solid #36c5ff;
  border-radius: 15px;
}
input, select {
  display: block;
  width: 100%;
  padding: 14px;
  margin: 12px 0;
  border-radius: 8px;
  font-size: 16px;
}
.note {
  padding: 10px 15px;
  color: #c5d5e8;
  line-height: 1.6;
}
footer {
  padding: 20px;
  color: #36c5ff;
}
@media (min-width: 650px) {
  .grid { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>
<body>

<header>
  <div style="font-size:40px">💎</div>
  <h1>WEBENS DIAMONDS</h1>
  <p>FREE FIRE TOP UP</p>
  <p>Bienvenue chez WEBENS DIAMONDS 💙</p>
</header>

<section class="intro">
  <h2>💎 CHOISIS TON PACK</h2>
  <p>Chwazi kantite dyaman ou vle a.</p>
</section>

<main class="grid" id="packs"></main>

<section>
  <h2>🎮 Commander</h2>
  <form id="orderForm">
    <label for="player">ID joueur Free Fire</label>
    <input id="player" type="text"
      inputmode="numeric"
      placeholder="Antre ID jwè a"
      required>

    <label for="pack">Pack choisi</label>
    <select id="pack" required>
      <option value="">Chwazi yon pake</option>
    </select>

    <p id="total">Pri: —</p>
    <button type="submit">CONTINUER LE paiement</button>
  </form>

  <p id="result" class="note" aria-live="polite"></p>
  <p class="note">
    Demo : les commandes et les paiements ne sont pas encore connectés.
    Pa fè peman jiskaske sèvis la konfime kòmand lan.
  </p>
</section>

<footer>
  <p>© 2026 WEBENS DIAMONDS 💙</p>
</footer>

<script>
const packs = [
  {diamonds:110, price:150},
  {diamonds:220, price:300},
  {diamonds:341, price:450},
  {diamonds:451, price:600},
  {diamonds:572, price:750},
  {diamonds:682, price:900},
  {diamonds:792, price:1050},
  {diamonds:913, price:1200},
  {diamonds:1023, price:1350},
  {diamonds:1166, price:1500},
  {diamonds:1507, price:2000},
  {diamonds:2398, price:3000},
  {diamonds:3564, price:4500},
  {diamonds:6160, price:7500}
];

const grid = document.getElementById("packs");
const selector = document.getElementById("pack");
const total = document.getElementById("total");
const result = document.getElementById("result");

function formatPrice(price) {
  return price.toLocaleString("en-US") + " GDS";
}

packs.forEach(item => {
  const name = item.diamonds + " Diamonds";
  const price = formatPrice(item.price);

  const card = document.createElement("article");
  card.className = "pack";

  const icon = document.createElement("div");
  icon.className = "diamond";
  icon.textContent = "💎";

  const title = document.createElement("h3");
  title.textContent = name;

  const amount = document.createElement("p");
  amount.className = "price";
  amount.textContent = price;

  const button = document.createElement("button");
  button.type = "button";
  button.textContent = "COMMANDER";

  const option = document.createElement("option");
  option.value = String(item.diamonds);
  option.textContent = name + " — " + price;
  selector.appendChild(option);

  button.addEventListener("click", () => {
    selector.value = String(item.diamonds);
    total.textContent = "Pri: " + price;
    document.getElementById("orderForm").scrollIntoView({
      behavior: "smooth"
    });
  });

  card.append(icon, title, amount, button);
  grid.appendChild(card);
});

selector.addEventListener("change", () => {
  const item = packs.find(
    p => String(p.diamonds) === selector.value
  );
  total.textContent = item
    ? "Pri: " + formatPrice(item.price)
    : "Pri: —";
});

document.getElementById("orderForm").addEventListener("submit", event => {
  event.preventDefault();

  const player = document.getElementById("player").value.trim();
  const item = packs.find(
    p => String(p.diamonds) === selector.value
  );

  if (!player || !item) {
    result.textContent = "Antre ID jwè a epi chwazi yon pake.";
    return;
  }

  result.textContent =
    "Ou chwazi " + item.diamonds + " Diamonds pou " +
    formatPrice(item.price) + ". Kòmand lan poko voye, paske " +
    "sistèm kòmand ak peman an poko konekte.";
});
</script>

</body>
</html>
